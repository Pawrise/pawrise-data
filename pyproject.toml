[project]
name = "pawrise-data"
version = "0.1.0"
description = "Composant Data pour Pawrise Care (TimescaleDB, pgvector, Kafka, MQTT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "psycopg[binary,pool]>=3.1.12",
    "confluent-kafka>=2.3.0",
    "paho-mqtt>=2.0.0",
    "rich>=13.0.0",
    "prometheus-client>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: test de bout en bout nécessitant la stack Docker (docker compose up -d)"]

[tool.coverage.run]
source = ["pawrise_data"]
branch = false
# Mesure aussi les sous-processus lancés par le test e2e (pont MQTT et consumer).
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
