[project]
name = "pawrise-data"
version = "0.1.0"
description = "Composant Data/IA pour Pawrise Care (TimescaleDB, pgvector, LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "psycopg[binary,pool]>=3.1.12",
    "confluent-kafka>=2.3.0",
    "paho-mqtt>=2.0.0",
    "langgraph>=0.0.27",
    "langchain>=0.1.0",
    "cohere>=4.45",
    "openai>=1.10.0",
    "rich>=13.0.0",
    "prometheus-client>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: test de bout en bout nécessitant la stack Docker (docker compose up -d)"]
