<text x="490" y="272" text-anchor="middle" font-size="11" fill="#475569">profil chien simulé · backend à venir</text>
<rect x="365" y="315" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
