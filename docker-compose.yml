services:
  postgres:
    build: 
      context: ./docker
      dockerfile: Dockerfile
    container_name: pawrise-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-pawrise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pawrise123}
      POSTGRES_DB: ${DB_NAME:-pawrise_care}
    volumes:
      - pawrise-db-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    networks:
      - pawrise_network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: pawrise-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pawrise-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: pawrise-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - pawrise_network
    restart: unless-stopped

networks:
  pawrise_network:

volumes:
  pawrise-db-data:
