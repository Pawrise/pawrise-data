services:
  postgres:
    build: 
      context: ./docker
      dockerfile: Dockerfile
    container_name: pawrise-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-pawrise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pawrise123}
      POSTGRES_DB: ${DB_NAME:-pawrise_care}
    volumes:
      - pawrise-db-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    networks:
      - pawrise_network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: pawrise-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pawrise-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: pawrise-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - pawrise_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pawrise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pawrise-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pawrise_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pawrise-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      DB_USER: ${DB_USER:-pawrise}
      DB_PASSWORD: ${DB_PASSWORD:-pawrise123}
      DB_NAME: ${DB_NAME:-pawrise_care}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pawrise-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    networks:
      - pawrise_network
    restart: unless-stopped

networks:
  pawrise_network:

volumes:
  pawrise-db-data:
  pawrise-prometheus-data:
  pawrise-grafana-data:
